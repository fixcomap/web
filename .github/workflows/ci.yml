# Este repo no tiene pipeline propio: llama a los reusable workflows de
# fixcomap/platform (rw-static-checks, rw-pages-deploy). La lógica, los pines y
# Renovate viven allí; aquí solo se declara qué sitio es y a dónde va.
#   PR       → checks + preview <rama>.fixcomap-landing.pages.dev  (environment preview)
#   develop  → checks + preview develop.fixcomap-landing.pages.dev (environment preview)
#   main     → checks + producción fixcomap.com / www              (environment production)
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

# Un workflow llamado no puede pedir más permisos que el job que lo llama: los
# reusables necesitan contents: read para el checkout.
jobs:
  checks:
    permissions:
      contents: read
    uses: fixcomap/platform/.github/workflows/rw-static-checks.yml@main
    with:
      site_dir: public

  deploy:
    needs: checks
    permissions:
      contents: read
    uses: fixcomap/platform/.github/workflows/rw-pages-deploy.yml@main
    with:
      project_name: fixcomap-landing
      site_dir: public
      environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      production_url: https://fixcomap.com
    secrets: inherit
