# Checks de PR contra develop y main. No hay despliegue aquí: Cloudflare Pages
# publica main y previsualiza develop por su cuenta.
name: pr-checks

on:
  pull_request:
    branches: [develop, main]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gitflow:
    name: gitflow (rama origen)
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE" in
            main)    pat='^(release|hotfix)/' ;;
            develop) pat='^(feature|bugfix|release|hotfix)/' ;;
            *)       echo "rama base no contemplada: $BASE"; exit 1 ;;
          esac
          echo "$HEAD" | grep -Eq "$pat" || { echo "'$HEAD' no puede mergearse en '$BASE' (patrón: $pat)"; exit 1; }

  security:
    name: gitleaks + trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner --redact --exit-code 1 .
      - name: trivy fs (secret + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  html-css:
    name: html + css
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validar HTML (W3C Nu)
        run: |
          docker run --rm -v "$PWD:/site:ro" ghcr.io/validator/validator:20.6.30 \
            vnu --skip-non-html --errors-only --also-check-css /site/public
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: stylelint
        run: |
          npm ci --no-audit --no-fund
          npm run -s lint:css
      - name: _headers con CSP
        # Sin JS en la página; la CSP estricta es parte del contrato de seguridad.
        run: |
          grep -q "Content-Security-Policy: default-src 'self'" public/_headers
          grep -q "frame-ancestors 'none'" public/_headers
      - name: assets referenciados existen
        # Fotos y CVs se suben a mano; el PR falla si index.html apunta a algo que no está.
        run: |
          missing=0
          while read -r f; do
            [ -f "public/$f" ] || { echo "::error::falta public/$f"; missing=1; }
          done < <(grep -oE '(src|href)="/assets/[^"]+"' public/index.html | sed -E 's/.*="\/(.*)"/\1/')
          exit $missing
